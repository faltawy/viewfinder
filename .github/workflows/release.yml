name: Release

# release-please keeps a release PR open that bumps version.txt and CHANGELOG.md from the Conventional Commits
# on dev. Merging it tags vX.Y.Z and creates the GitHub release; the apk job then attaches the signed APK.
on:
  push:
    branches: [dev]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  apk:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: ./.github/actions/gradle

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VIEWFINDER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret VIEWFINDER_KEYSTORE_BASE64 is missing. See docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build the release APK
        env:
          VIEWFINDER_KEYSTORE: ${{ runner.temp }}/release.jks
          VIEWFINDER_KEYSTORE_PASSWORD: ${{ secrets.VIEWFINDER_KEYSTORE_PASSWORD }}
          VIEWFINDER_KEY_ALIAS: ${{ secrets.VIEWFINDER_KEY_ALIAS }}
          VIEWFINDER_KEY_PASSWORD: ${{ secrets.VIEWFINDER_KEY_PASSWORD }}
        run: |
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :ptp:test :app:testDebugUnitTest :app:assembleRelease
          apk="$RUNNER_TEMP/viewfinder-${{ needs.release-please.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" "$APK" --clobber
