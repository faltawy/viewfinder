name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gradle
      - name: Tests
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :ptp:test :app:testDebugUnitTest :app:assembleDebug
